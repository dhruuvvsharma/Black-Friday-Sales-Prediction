version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.fastapi
    ports:
      - "8000:8000"
    volumes:
      - ./artifacts:/app/artifacts:ro
    env_file:
      - .env

  ui:
    build:
      context: .
      dockerfile: Dockerfile.streamlit
    ports:
      - "8501:8501"
    volumes:
      - ./artifacts:/app/artifacts:ro
    depends_on:
      - api
    environment:
      - API_URL=http://api:8000
    env_file:
      - .env